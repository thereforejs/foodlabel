# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  sequence_diagrams: false
  in_progress_fortune: false
  auto_review:
    enabled: true
    drafts: false
    # Release PRs from uppt only carry the version and the changelog.
    ignore_usernames:
      - github-actions[bot]
  path_filters:
    # Generated by scripts/additives-de.ts from the legal text; review the script, not its output.
    - "!src/additives/de.json"
    - "!pnpm-lock.yaml"
    - "!docs/**"
  path_instructions:
    - path: "**"
      instructions: |
        This library turns recipes into EU food labels (Regulation (EU) No 1169/2011). A wrong output can
        hide an allergen, so correctness beats style. SPEC.md is the source of truth for every rule.
        - No em dashes or en dashes anywhere (code, comments, docs); a plain hyphen only.
        - Comments explain why, not what; few and short. Where a legal rule is enforced, its citation
          (regulation, article or annex) is the comment.
    - path: "src/**/*.ts"
      instructions: |
        - Amounts, shares, percentages and nutrients use @thereforejs/decy only. Flag any arithmetic,
          comparison or rounding on JavaScript numbers for such values.
        - Never estimate: a missing or unknown value must refuse the result through fail(code, path,
          params) from src/diagnostics/fail.ts with a code from src/diagnostics/codes.ts. Flag
          `throw new Error`, silent defaults, or a value that is quietly ignored.
        - Allergens are found by whole vocabulary pieces only. Flag substring matching (includes,
          indexOf, startsWith on ingredient names) for allergen or ingredient detection.
        - In doubt the library declares: flag logic that could drop an allergen or hide information.
        - Pure and deterministic: no I/O, no Date, no randomness, no locale taken from the environment.
        - No `any`, no `as never`, no dead guards. Imports from vite-plus, never from vite or vitest.
    - path: "src/**/*.json"
      instructions: |
        Vocabulary data in German. Check that every term is a whole word (not a fragment), that a word is
        in only one list, and that every `kinds` variant and base form is also a term of the same allergen.
    - path: "tests/**/*.ts"
      instructions: |
        Every rule needs a test that fails without it. Prefer exact expected output over loose matching.
        Property tests use fast-check. Do not suggest weakening an assertion to make a test pass.
    - path: "scripts/**/*.ts"
      instructions: |
        Maintainer scripts that build data from legal texts; they never ship. Check that the parsing is
        reproducible and that nothing from the source is dropped silently.

chat:
  auto_reply: true
